name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 매일 03:23 KST: DB 에서 대회 목록(public/data.json)을 새로 떠서 다시 배포
  schedule:
    - cron: '23 18 * * *'

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Refresh built-in data snapshot
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run snapshot

      # 이번 배포 전에 공개돼 있는 sitemap — IndexNow 가 새로 생기거나 lastmod 가 바뀐 주소만 고르는 데 쓴다.
      # 저장소 루트에 저장하므로 dist 밖이라 배포되지 않는다. 못 받아도(첫 배포 등) 넘어간다.
      - name: Save previous sitemap
        run: curl -fsS --max-time 20 https://marathon82.com/sitemap.xml -o prev-sitemap.xml || true

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GA_ID: ${{ vars.VITE_GA_ID }}
          # 빙 웹마스터 도구 소유 확인 값 (저장소 변수, 비워 두면 meta 를 출력하지 않는다)
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
        run: npm run build

      - name: Deploy site (Cloudflare Pages)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name marathoncalendar --branch main --commit-dirty=true

      # 새로 생기거나 lastmod 가 바뀐 주소를 빙·네이버에 알린다(IndexNow). 실패해도 배포는 실패시키지 않는다(경고만).
      - name: IndexNow
        continue-on-error: true
        run: node scripts/indexnow.mjs --prev prev-sitemap.xml

      - name: Deploy DB keepalive cron (no public URL)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c wrangler.cron.jsonc

      - name: Deploy old-address redirect
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy old-domain redirect
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c wrangler.redirect.jsonc
