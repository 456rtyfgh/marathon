name: 공식 홈페이지 링크 점검

# 매주 토요일 03:40 KST (금 18:40 UTC). 도박·도메인 판매·없어진 주소로 바뀐 공식 홈페이지를
# 찾아 바로 검색 링크로 내린다. 공식 주소로 다시 바꾸는 건 매주 월요일 갱신 작업이 한다.
on:
  schedule:
    - cron: '40 18 * * 5'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 링크 점검 (+ 문제 링크 내리기)
        env:
          AUTOMATION_KEY: ${{ secrets.AUTOMATION_KEY }}
        run: python3 scripts/link_audit.py --fix --out audit
      - name: 결과 요약
        if: always()
        run: cat audit/link-audit.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: link-audit
          path: audit/
          retention-days: 30
