<!doctype html>
<!--
  public/og.png 원본 (1200×630). 로고 파일은 scripts/brand.mjs 가 만든다(먼저 돌릴 것).
  만드는 법: 저장소 루트에서
    agent-browser set viewport 1200 630
    agent-browser open "file://$PWD/scripts/og.html"
    agent-browser screenshot public/og.png
  남색 바탕 + 흰 타일 심볼 + 흰 워드마크 + 한 줄 설명. 색은 로고 색(남색 #0E2A47)만 쓴다.
-->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../node_modules/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.css" />
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 44px;
        background: #0e2a47;
        color: #fff;
        font-family: 'Wanted Sans Variable', 'Wanted Sans', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .lockup {
        display: flex;
        align-items: center;
        gap: 36px;
      }
      .lockup img {
        display: block;
      }
      p {
        font-size: 38px;
        font-weight: 500;
        letter-spacing: -0.01em;
        opacity: 0.82;
      }
    </style>
  </head>
  <body>
    <div class="lockup">
      <img src="../public/brand/symbol-inverse.svg" width="168" height="168" alt="" />
      <img src="../public/brand/wordmark-inverse.svg" width="740" height="64" alt="marathoncalendar" />
    </div>
    <p>국내·해외 마라톤의 접수 방식과 접수 기간 모음</p>
  </body>
</html>
